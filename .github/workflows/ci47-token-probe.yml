name: CI 47 workflow token metadata probe
on:
  push:
    branches: [ws-47]
permissions:
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify native issue metadata and clean up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/issues" --method POST \
            -f title='CI 47 temporary workflow-token metadata probe' \
            -f body='Temporary unassigned API probe for CI 47. The workflow closes this issue immediately; this is not review work.' \
            -f type=Maintenance \
            -F 'issue_field_values[][field_id]=46102352' \
            -f 'issue_field_values[][value]=Medium' > "$RUNNER_TEMP/created.json"
          issue_number=$(jq -er .number "$RUNNER_TEMP/created.json")
          trap 'gh api "repos/$REPOSITORY/issues/$issue_number" --method PATCH -f state=closed --silent' EXIT
          gh api "repos/$REPOSITORY/issues/$issue_number" > "$RUNNER_TEMP/readback.json"
          jq '{number,type:.type.name,issue_field_values,assignees}' "$RUNNER_TEMP/readback.json"
          jq -e '.type.name == "Maintenance" and (.assignees | length == 0) and any(.issue_field_values[]; .issue_field_id == 46102352 and .single_select_option.name == "Medium")' "$RUNNER_TEMP/readback.json"
