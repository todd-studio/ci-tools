name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust-root:
    name: Trust root (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck ci-fetch.sh tests/ci-fetch.test.sh
      - name: Prove checksum enforcement
        run: bash tests/ci-fetch.test.sh
